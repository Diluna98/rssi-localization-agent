seed: 42

environment:
  width_m: 12.0
  height_m: 10.0
  anchors:
    - [0.5, 0.5]
    - [11.5, 0.5]
    - [0.5, 9.5]
    - [11.5, 9.5]
    - [6.0, 5.0]

rssi_model:
  reference_rssi_dbm: -40.0
  reference_distance_m: 1.0
  path_loss_exponent: 2.2
  noise_std_db: 3.0
  min_distance_m: 0.25

data:
  train_samples: 256
  validation_samples: 64
  test_samples: 64
  output_dir: data/ci

training:
  batch_size: 64
  epochs: 2
  learning_rate: 0.001
  hidden_dims: [32, 32]
  dropout: 0.0
  model_path: artifacts/ci/model.pt
  scaler_path: artifacts/ci/scaler.npz

evaluation:
  metrics_path: artifacts/ci/metrics.json
  prediction_plot_path: artifacts/ci/predictions.png
