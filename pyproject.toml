[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rssi-localization-agent"
version = "0.1.0"
description = "RSSI-based indoor localization with simulation, baselines, and neural network regression."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Portfolio Project" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "matplotlib>=3.7"
]

[project.scripts]
rssi-simulate = "rssi_localization.scripts.simulate_data:main"
rssi-train = "rssi_localization.scripts.train_model:main"
rssi-evaluate = "rssi_localization.scripts.evaluate_model:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
