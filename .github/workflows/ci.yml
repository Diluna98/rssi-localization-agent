name: CI/CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  quality:
    name: Test and smoke train
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest

      - name: Simulate CI dataset
        run: rssi-simulate --config configs/ci.yaml

      - name: Train CI smoke model
        run: rssi-train --config configs/ci.yaml

      - name: Evaluate CI smoke model
        run: rssi-evaluate --config configs/ci.yaml

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-localization-artifacts
          path: |
            artifacts/ci/metrics.json
            artifacts/ci/predictions.png
            artifacts/ci/error_heatmap.png
            artifacts/ci/report.md
          if-no-files-found: error

  docker:
    name: Test Docker image
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          push: false
          tags: rssi-localization-agent:test

      - name: Run tests in container
        run: docker run --rm rssi-localization-agent:test pytest

      - name: Run smoke pipeline in container
        run: |
          docker run --rm rssi-localization-agent:test sh -c "\
            rssi-simulate --config configs/ci.yaml && \
            rssi-train --config configs/ci.yaml && \
            rssi-evaluate --config configs/ci.yaml"

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          push: false
          tags: rssi-localization-agent:ci

  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/diluna98/rssi-localization-agent
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
